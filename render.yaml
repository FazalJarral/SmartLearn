services:
  - type: web
    name: smartlearn-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: smartlearn-private
      - key: GENERATION_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_TIMEOUT_SECONDS
        value: "120"
      - key: DEEPSEEK_MAX_TOKENS
        value: "10000"
      - key: MAX_EXTRACTED_CHARS
        value: "60000"
      - key: OPENAI_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: piper
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: alloy
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: GOOGLE_TTS_VOICE
        value: en-US-Standard-C
      - key: GOOGLE_TTS_LANGUAGE_CODE
        value: en-US
